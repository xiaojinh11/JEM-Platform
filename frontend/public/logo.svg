<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- JEM Logo - Blue Diamond on Circuit Board Base -->
  <defs>
    <linearGradient id="diamondGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circuitGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circuit Board Base -->
  <rect x="10" y="38" width="44" height="18" rx="2" fill="url(#circuitGradient)" opacity="0.9"/>
  <rect x="12" y="40" width="40" height="14" rx="1" fill="none" stroke="#14b8a6" stroke-width="1.5" opacity="0.6"/>

  <!-- Circuit Lines -->
  <line x1="16" y1="47" x2="48" y2="47" stroke="#0ea5e9" stroke-width="2" opacity="0.5"/>
  <circle cx="20" cy="47" r="2" fill="#06b6d4"/>
  <circle cx="32" cy="47" r="2" fill="#06b6d4"/>
  <circle cx="44" cy="47" r="2" fill="#06b6d4"/>

  <!-- Diamond Main Body -->
  <path d="M32 8 L48 24 L32 48 L16 24 Z" fill="url(#diamondGradient)" opacity="0.95"/>

  <!-- Diamond Facets -->
  <path d="M32 8 L48 24 L32 28 Z" fill="#0ea5e9" opacity="0.7"/>
  <path d="M32 8 L16 24 L32 28 Z" fill="#06b6d4" opacity="0.8"/>
  <path d="M16 24 L32 48 L32 28 Z" fill="#14b8a6" opacity="0.6"/>
  <path d="M48 24 L32 48 L32 28 Z" fill="#0891b2" opacity="0.7"/>

  <!-- Diamond Highlight -->
  <path d="M28 14 L32 8 L36 14 L32 18 Z" fill="white" opacity="0.4"/>

  <!-- Circular Arrows (Data Flow) -->
  <path d="M 52 18 A 8 8 0 0 1 56 26" stroke="#0ea5e9" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 8 26 A 8 8 0 0 1 12 18" stroke="#0ea5e9" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Arrow Heads -->
  <polygon points="56,24 58,26 56,28" fill="#0ea5e9" opacity="0.7"/>
  <polygon points="12,16 10,18 8,16" fill="#0ea5e9" opacity="0.7"/>

  <!-- Upward Growth Arrow -->
  <path d="M 50 32 L 56 26 L 62 32" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  <line x1="56" y1="26" x2="56" y2="36" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
