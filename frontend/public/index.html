<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEM Automated Operations Platform</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0ea5e9 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .container {
      text-align: center;
      padding: 40px;
      max-width: 600px;
    }
    .logo-wrapper {
      margin-bottom: 30px;
      animation: float 3s ease-in-out infinite;
    }
    .logo-wrapper img {
      width: 120px;
      height: 120px;
      filter: drop-shadow(0 10px 40px rgba(14, 165, 233, 0.6));
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    h1 {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #06b6d4, #14b8a6, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      font-size: 18px;
      color: #94a3b8;
      letter-spacing: 2px;
      margin-bottom: 40px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .status {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 30px;
    }
    .status-title {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .status-item:last-child { border-bottom: none; }
    .status-label {
      font-size: 14px;
      color: #e2e8f0;
    }
    .status-value {
      font-size: 14px;
      font-weight: 600;
    }
    .status-ok { color: #10b981; }
    .status-error { color: #ef4444; }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #0ea5e9, #06b6d4);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(14, 165, 233, 0.6);
    }
    .footer {
      margin-top: 40px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrapper">
      <img src="/logo.svg" alt="JEM Logo">
    </div>
    <h1>JEM</h1>
    <div class="subtitle">Automated Operations Platform</div>

    <div class="status">
      <div class="status-title">系统状态</div>
      <div class="status-item">
        <span class="status-label">前端服务</span>
        <span class="status-value status-ok">● 运行中</span>
      </div>
      <div class="status-item">
        <span class="status-label">后端 API</span>
        <span class="status-value status-error" id="backend-status">● 未启动</span>
      </div>
      <div class="status-item">
        <span class="status-label">数据库</span>
        <span class="status-value status-error" id="db-status">● 未连接</span>
      </div>
    </div>

    <a href="/#/login" class="btn">进入控制台</a>

    <div class="footer">
      © 2026 JEM Platform · 网络自动化运维平台
    </div>
  </div>

  <script>
    // 检查后端 API 状态
    fetch('/api/v1/health')
      .then(res => res.ok ? res.json() : Promise.reject())
      .then(() => {
        document.getElementById('backend-status').className = 'status-value status-ok';
        document.getElementById('backend-status').textContent = '● 运行中';
        document.getElementById('db-status').className = 'status-value status-ok';
        document.getElementById('db-status').textContent = '● 已连接';
      })
      .catch(() => {
        console.warn('Backend API not available');
      });
  </script>
</body>
</html>
